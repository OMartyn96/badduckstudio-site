<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="preload" href="Build/WEBGL_Demo.framework.js.unityweb" as="fetch" crossorigin>
    <link rel="preload" href="Build/WEBGL_Demo.wasm.unityweb" as="fetch" crossorigin>
    <link rel="preload" href="https://media.githubusercontent.com/media/OMartyn96/badduckstudio-site/main/word-wild-west/demo/Build/WEBGL_Demo.data.unityweb" as="fetch" crossorigin>
    <title>Word Wild West Demo | Bad Duck Studio</title>
    <style>
      :root {
        --bg: #f3f1ed;
        --text: #3e3d3b;
        --muted: #6f6c67;
        --accent: #ec6907;
        --accent-dark: #2f2e2c;
        --border: #ddd8d2;
      }

      * {
        box-sizing: border-box;
      }

      html,
      body {
        min-height: 100%;
      }

      body {
        margin: 0;
        font-family: Arial, Helvetica, sans-serif;
        background: var(--bg);
        color: var(--text);
      }

      .demo-page {
        min-height: 100vh;
        display: grid;
        grid-template-rows: auto 1fr;
      }

      .demo-header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 16px;
        padding: 18px clamp(16px, 4vw, 42px);
        border-bottom: 4px solid var(--accent);
        background: var(--accent-dark);
        color: #ffffff;
      }

      .demo-header h1 {
        margin: 0;
        font-size: clamp(20px, 3vw, 30px);
        line-height: 1.2;
      }

      .demo-header p {
        margin: 4px 0 0;
        color: #ebe8e3;
      }

      .demo-header a {
        flex-shrink: 0;
        padding: 10px 14px;
        border-radius: 8px;
        background: var(--accent);
        color: #ffffff;
        font-weight: 700;
        text-decoration: none;
      }

      .demo-stage {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 16px;
        padding: clamp(18px, 4vw, 42px);
      }

      .demo-toolbar {
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        justify-content: center;
        gap: 10px;
        width: min(96vw, 1180px);
      }

      .demo-toolbar span {
        color: var(--muted);
        font-size: 14px;
        font-weight: 700;
      }

      .demo-size-button {
        border: 1px solid var(--border);
        border-radius: 999px;
        padding: 9px 14px;
        background: #ffffff;
        color: var(--text);
        cursor: pointer;
        font: inherit;
        font-weight: 700;
      }

      .demo-size-button[aria-pressed="true"] {
        border-color: var(--accent);
        background: var(--accent);
        color: #ffffff;
      }

      .demo-shell {
        --demo-aspect: 16 / 9;
        --demo-max-width: min(1180px, calc((100vh - 210px) * 16 / 9));
        position: relative;
        width: min(96vw, var(--demo-max-width));
        aspect-ratio: var(--demo-aspect);
        padding: 10px;
        border: 2px solid #1b1714;
        border-radius: 18px;
        background: #17120f;
        box-shadow: 0 24px 60px rgba(0, 0, 0, 0.28);
      }

      .demo-page[data-demo-size="portrait"] .demo-shell {
        --demo-aspect: 9 / 16;
        --demo-max-width: min(560px, calc((100vh - 210px) * 9 / 16));
      }

      .demo-page[data-demo-size="original"] .demo-shell {
        --demo-aspect: 270 / 800;
        --demo-max-width: min(360px, calc((100vh - 210px) * 270 / 800));
      }

      .screen {
        position: relative;
        width: 100%;
        height: 100%;
        overflow: hidden;
        border-radius: 10px;
        background: #1f1f20;
      }

      #unity-canvas {
        display: block;
        width: 100%;
        height: 100%;
        background: #1f1f20;
      }

      .loading-note {
        position: absolute;
        inset: 0;
        display: grid;
        place-items: center;
        padding: 24px;
        background: #1f1f20;
        color: #ffffff;
        font-weight: 700;
        text-align: center;
      }

      .loading-note small {
        display: block;
        max-width: 220px;
        margin-top: 10px;
        color: #d8d2cb;
        font-size: 12px;
        font-weight: 400;
        line-height: 1.4;
      }

      .screen.is-loaded .loading-note {
        display: none;
      }

      @media (max-width: 640px) {
        .demo-header {
          align-items: flex-start;
          flex-direction: column;
        }

        .demo-header a {
          width: 100%;
          text-align: center;
        }

        .demo-stage {
          padding: 12px;
        }

        .demo-toolbar {
          justify-content: flex-start;
          width: 100%;
        }

        .demo-shell {
          --demo-max-width: 96vw;
          padding: 8px;
          border-radius: 14px;
        }

      }
    </style>
  </head>
  <body>
    <main class="demo-page" data-demo-size="wide">
      <header class="demo-header">
        <div>
          <h1>Word Wild West Demo</h1>
          <p>Playable WebGL demo</p>
        </div>
        <a href="../">Back to game page</a>
      </header>

      <section class="demo-stage" aria-label="Word Wild West playable demo">
        <div class="demo-toolbar" aria-label="Demo screen size">
          <span>Screen size</span>
          <button class="demo-size-button" type="button" data-demo-size-button="wide" aria-pressed="true">Wide</button>
          <button class="demo-size-button" type="button" data-demo-size-button="portrait" aria-pressed="false">Portrait</button>
          <button class="demo-size-button" type="button" data-demo-size-button="original" aria-pressed="false">Original</button>
        </div>

        <div class="demo-shell">
          <div class="screen" id="demo-screen">
            <canvas id="unity-canvas" width="960" height="540" tabindex="-1"></canvas>
            <div class="loading-note">
              Loading demo...
              <small>The first load can take a little while because the WebGL build is large.</small>
            </div>
          </div>
        </div>
      </section>
    </main>

    <script src="Build/WEBGL_Demo.loader.js"></script>
    <script>
      const canvas = document.querySelector("#unity-canvas");
      const screen = document.querySelector("#demo-screen");
      const page = document.querySelector(".demo-page");
      const sizeButtons = document.querySelectorAll("[data-demo-size-button]");

      sizeButtons.forEach((button) => {
        button.addEventListener("click", () => {
          page.dataset.demoSize = button.dataset.demoSizeButton;
          sizeButtons.forEach((item) => {
            item.setAttribute("aria-pressed", String(item === button));
          });
          window.setTimeout(() => window.dispatchEvent(new Event("resize")), 50);
        });
      });

      createUnityInstance(canvas, {
        arguments: [],
        dataUrl: "https://media.githubusercontent.com/media/OMartyn96/badduckstudio-site/main/word-wild-west/demo/Build/WEBGL_Demo.data.unityweb",
        frameworkUrl: "Build/WEBGL_Demo.framework.js.unityweb",
        codeUrl: "Build/WEBGL_Demo.wasm.unityweb",
        streamingAssetsUrl: "StreamingAssets",
        companyName: "BadDuckStudio",
        productName: "WordWildWest",
        productVersion: "1.0",
        matchWebGLToCanvasSize: true,
        devicePixelRatio: 1,
      }).then((unityInstance) => {
        screen.classList.add("is-loaded");
      }).catch((message) => {
        alert(message);
      });
    </script>
  </body>
</html>
